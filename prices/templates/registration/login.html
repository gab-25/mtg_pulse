{% extends "base.html" %}
{% block title %}Log in · MTG Pulse{% endblock %}
{% block content %}
<section class="login">
  <h1>Log in</h1>
  {% if form.errors %}<p class="error">Wrong username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
