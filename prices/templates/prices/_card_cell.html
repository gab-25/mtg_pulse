<div class="card-cell">
  {% if card.image_small %}
    <img class="thumb" src="{{ card.image_small }}" alt="" width="40" height="56" loading="lazy"{% if card.image_normal %} data-preview="{{ card.image_normal }}"{% endif %}>
  {% else %}
    <div class="thumb thumb-missing" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="1.5" width="12" height="13" rx="1.5" stroke="#7a7062" stroke-width="1.25"/><path d="M5 10l2-2.5 1.5 1.5L10 7l1 3" stroke="#7a7062" stroke-width="1.25" stroke-linejoin="round"/></svg></div>
  {% endif %}
  <div>
    <a href="{% url 'card_detail' card.id_product %}">{{ card }}</a>
    {% if show_expansion %}<div class="expansion">{{ card.expansion_name|default:"Unknown expansion" }}</div>{% endif %}
  </div>
</div>
