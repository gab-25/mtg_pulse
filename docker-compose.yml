services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: mtg_pulse
      POSTGRES_PASSWORD: mtg_pulse
      POSTGRES_DB: mtg_pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_pulse -d mtg_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
