services:
  db:
    # Pinned: upgrading needs ALTER EXTENSION timescaledb UPDATE on the existing volume.
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: tcg_pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg_pulse}
      POSTGRES_DB: tcg_pulse
      PULSE_DB_READER_PASSWORD: ${PULSE_DB_READER_PASSWORD:?set PULSE_DB_READER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is created: makes the read-only grafana_reader role.
      - ./db/init/10-grafana-reader.sh:/docker-entrypoint-initdb.d/10-grafana-reader.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg_pulse -d tcg_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rising.json
      PULSE_DB_HOST: db
      PULSE_DB_NAME: tcg_pulse
      PULSE_DB_READER_PASSWORD: ${PULSE_DB_READER_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only reachable from the host: put the HTTPS reverse proxy in front.
      - "127.0.0.1:3000:3000"

  sync:
    # Runs once on `docker compose up`; run it again with `docker compose run --rm sync`.
    build: .
    environment:
      DATABASE_URL: postgresql://tcg_pulse:${POSTGRES_PASSWORD:-tcg_pulse}@db:5432/tcg_pulse
    volumes:
      - syncdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  grafana-data:
  syncdata:
