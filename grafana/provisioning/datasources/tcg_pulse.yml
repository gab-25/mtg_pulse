apiVersion: 1

# Grafana installs set up before the rename have this datasource under its old name.
deleteDatasources:
  - name: Pulse
    orgId: 1

datasources:
  - name: TCG Pulse
    uid: tcg_pulse
    type: grafana-postgresql-datasource
    url: ${TCG_PULSE_DB_HOST}:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${TCG_PULSE_DB_NAME}
      sslmode: ${TCG_PULSE_DB_SSLMODE:-disable}
      postgresVersion: 1700
      timescaledb: true
    secureJsonData:
      password: ${TCG_PULSE_DB_READER_PASSWORD}
