[project]
name = "mtg-pulse"
version = "0.6.0"
description = "Daily Cardmarket prices for Magic, Pokémon, One Piece and Riftbound, shown in Grafana"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
