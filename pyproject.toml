[project]
name = "mtg-pulse"
version = "0.5.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mtg_pulse.test_settings"
python_files = ["test_*.py"]
