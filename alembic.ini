# Used by the alembic CLI, e.g. after changing pulse/models.py:
#   DATABASE_URL=postgresql://tcg_pulse:tcg_pulse@localhost:5432/tcg_pulse uv run alembic revision --autogenerate -m "..."
# The sync applies pending migrations itself on every run.
[alembic]
script_location = pulse/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
